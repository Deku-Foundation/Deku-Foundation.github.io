name: Website validation and deployment

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate site structure and accessibility basics
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check required site files, locale metadata and local links
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s assets/styles.css
          test -s assets/main.js
          test -s assets/deku-mark.svg
          test -s 404.html
          test -s robots.txt
          test -s sitemap.xml
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlparse
          import sys

          ROOT = Path(".").resolve()
          ALLOWED_LANGS = {"en", "fr", "ar"}

          class Check(HTMLParser):
              def __init__(self, file):
                  super().__init__(convert_charrefs=True)
                  self.file = file
                  self.errors = []
                  self.lang = None
                  self.direction = None
                  self.title_seen = False
                  self.description_seen = False
                  self.h1_count = 0
                  self.ids = set()
                  self.duplicate_ids = set()
                  self.local_refs = []

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == "html":
                      self.lang = attrs.get("lang")
                      self.direction = attrs.get("dir", "ltr")
                  if tag == "title":
                      self.title_seen = True
                  if tag == "meta" and attrs.get("name", "").lower() == "description":
                      self.description_seen = bool(attrs.get("content", "").strip())
                  if tag == "h1":
                      self.h1_count += 1
                  if "id" in attrs:
                      identifier = attrs["id"]
                      if identifier in self.ids:
                          self.duplicate_ids.add(identifier)
                      self.ids.add(identifier)
                  if tag == "img" and "alt" not in attrs:
                      self.errors.append(f"{self.file}: image is missing an alt attribute")

                  for key in ("href", "src"):
                      if key not in attrs:
                          continue
                      value = attrs[key]
                      if not value.strip():
                          self.errors.append(f"{self.file}: empty {key} attribute")
                          continue
                      parsed = urlparse(value)
                      if parsed.scheme:
                          if parsed.scheme.lower() not in {"https", "http", "mailto", "tel", "data"}:
                              self.errors.append(f"{self.file}: unsupported URL scheme in {key}: {value}")
                          continue
                      if value.startswith("//"):
                          continue
                      if not parsed.path:
                          if parsed.fragment:
                              self.local_refs.append((self.file, parsed.fragment))
                          continue
                      if parsed.path.startswith("/"):
                          target = (ROOT / parsed.path.lstrip("/")).resolve()
                      else:
                          target = (self.file.parent / parsed.path).resolve()
                      if ROOT not in target.parents and target != ROOT:
                          self.errors.append(f"{self.file}: local {key} escapes repository: {value}")
                          continue
                      if target.is_dir():
                          target_file = target / "index.html"
                      else:
                          target_file = target
                      if not target.exists() or (target.is_dir() and not target_file.is_file()):
                          self.errors.append(f"{self.file}: missing local {key} target {value}")
                          continue
                      if parsed.fragment and target_file.suffix.lower() == ".html":
                          self.local_refs.append((target_file, parsed.fragment))

          files = sorted(path for path in ROOT.rglob("*.html") if ".git" not in path.parts)
          checks = {}
          errors = []
          for file in files:
              checker = Check(file)
              checker.feed(file.read_text(encoding="utf-8"))
              checks[file.resolve()] = checker
              errors.extend(checker.errors)
              if checker.lang not in ALLOWED_LANGS:
                  errors.append(f"{file}: html lang must be one of {sorted(ALLOWED_LANGS)}")
              if checker.lang == "ar" and checker.direction != "rtl":
                  errors.append(f"{file}: Arabic documents must set dir=rtl on the html element")
              if not checker.title_seen:
                  errors.append(f"{file}: missing title")
              if not checker.description_seen:
                  errors.append(f"{file}: missing meta description")
              if checker.h1_count != 1:
                  errors.append(f"{file}: expected exactly one h1, found {checker.h1_count}")
              for identifier in sorted(checker.duplicate_ids):
                  errors.append(f"{file}: duplicate id {identifier!r}")
          for file, fragment in (ref for checker in checks.values() for ref in checker.local_refs):
              checker = checks.get(file.resolve())
              if checker and fragment not in checker.ids:
                  errors.append(f"{file}: missing local fragment #{fragment}")
          if not files:
              errors.append("No HTML files found")
          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print(f"Validated {len(files)} HTML files for local links, language metadata, unique IDs, image alternatives and core document structure.")
          PY
      - name: Validate sitemap URLs and language alternates
        run: python3 scripts/check_sitemap.py
      - name: Check JavaScript syntax
        run: node --check assets/main.js

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: .
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
