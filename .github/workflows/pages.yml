name: Website validation and deployment

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate site structure and accessibility basics
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check required site files, locale metadata and local links
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s assets/styles.css
          test -s assets/main.js
          test -s assets/deku-mark.svg
          test -s 404.html
          test -s robots.txt
          test -s sitemap.xml
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlparse
          import sys

          ROOT = Path(".").resolve()
          ALLOWED_LANGS = {"en", "fr", "ar"}

          class Check(HTMLParser):
              def __init__(self, file):
                  super().__init__(convert_charrefs=True)
                  self.file = file
                  self.errors = []
                  self.lang = None
                  self.direction = None
                  self.title_seen = False
                  self.description_seen = False
                  self.h1_count = 0
                  self.ids = set()
                  self.duplicate_ids = set()
                  self.local_refs = []

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == "html":
                      self.lang = attrs.get("lang")
                      self.direction = attrs.get("dir", "ltr")
                  if tag == "title":
                      self.title_seen = True
                  if tag == "meta" and attrs.get("name", "").lower() == "description":
                      self.description_seen = bool(attrs.get("content", "").strip())
                  if tag == "h1":
                      self.h1_count += 1
                  if "id" in attrs:
                      identifier = attrs["id"]
                      if identifier in self.ids:
                          self.duplicate_ids.add(identifier)
                      self.ids.add(identifier)
                  if tag == "img" and "alt" not in attrs:
                      self.errors.append(f"{self.file}: image is missing an alt attribute")

                  for key in ("href", "src"):
                      if key not in attrs:
                          continue
                      value = attrs[key]
                      if not value.strip():
                          self.errors.append(f"{self.file}: empty {key} attribute")
                          continue
                      parsed = urlparse(value)
                      if parsed.scheme:
                          if parsed.scheme.lower() not in {"https", "http", "mailto", "tel", "data"}:
                              self.errors.append(f"{self.file}: unsupported URL scheme in {key}: {value}")
                          continue
                      if value.startswith("//"):
                          continue
                      if not parsed.path:
                          if parsed.fragment:
                              self.local_refs.append((self.file, parsed.fragment))
                          continue
                      if parsed.path.startswith("/"):
                          target = (ROOT / parsed.path.lstrip("/")).resolve()
                      else:
                          target = (self.file.parent / parsed.path).resolve()
                      if ROOT not in target.parents and target != ROOT:
                          self.errors.append(f"{self.file}: local {key} escapes repository: {value}")
                          continue
                      if target.is_dir():
                          target_file = target / "index.html"
                      else:
                          target_file = target
                      if not target.exists() or (target.is_dir() and not target_file.is_file()):
                          self.errors.append(f"{self.file}: missing local {key} target {value}")
                          continue
                      if parsed.fragment and target_file.suffix.lower() == ".html":
                          self.local_refs.append((target_file, parsed.fragment))

          files = sorted(path for path in ROOT.rglob("*.html") if ".git" not in path.parts)
          checks = {}
          errors = []
          for file in files:
              checker = Check(file)
              checker.feed(file.read_text(encoding="utf-8"))
              checks[file.resolve()] = checker
              errors.extend(checker.errors)
              if checker.lang not in ALLOWED_LANGS:
                  errors.append(f"{file}: html lang must be one of {sorted(ALLOWED_LANGS)}")
              if checker.lang == "ar" and checker.direction != "rtl":
                  errors.append(f"{file}: Arabic documents must set dir=rtl on the html element")
              if not checker.title_seen:
                  errors.append(f"{file}: missing title")
              if not checker.description_seen:
                  errors.append(f"{file}: missing meta description")
              if checker.h1_count != 1:
                  errors.append(f"{file}: expected exactly one h1, found {checker.h1_count}")
              for identifier in sorted(checker.duplicate_ids):
                  errors.append(f"{file}: duplicate id {identifier!r}")
          for file, fragment in (ref for checker in checks.values() for ref in checker.local_refs):
              checker = checks.get(file.resolve())
              if checker and fragment not in checker.ids:
                  errors.append(f"{file}: missing local fragment #{fragment}")
          if not files:
              errors.append("No HTML files found")
          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print(f"Validated {len(files)} HTML files for local links, language metadata, unique IDs, image alternatives and core document structure.")
          PY
      - name: Validate canonical URLs, language alternates and sitemap coverage
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlparse
          import sys
          import xml.etree.ElementTree as ET

          ROOT = Path(".").resolve()
          ORIGIN = "https://deku-foundation.github.io"
          SITEMAP_NS = "{http://www.sitemaps.org/schemas/sitemap/0.9}"
          XHTML_NS = "{http://www.w3.org/1999/xhtml}"

          def route_to_file(url):
              parsed = urlparse(url)
              if parsed.scheme or parsed.netloc:
                  if parsed.scheme != "https" or parsed.netloc != "deku-foundation.github.io":
                      raise ValueError(f"unexpected canonical host: {url}")
              route = parsed.path or "/"
              if not route.startswith("/") or ".." in route.split("/"):
                  raise ValueError(f"invalid public route: {url}")
              candidate = (ROOT / route.lstrip("/")).resolve()
              if candidate.is_dir():
                  candidate = candidate / "index.html"
              elif route.endswith("/"):
                  candidate = candidate / "index.html"
              if ROOT not in candidate.parents and candidate != ROOT:
                  raise ValueError(f"route escapes repository: {url}")
              return candidate

          class Metadata(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.canonical = []
                  self.alternates = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag.lower() != "link":
                      return
                  rel = set(attrs.get("rel", "").lower().split())
                  if "canonical" in rel and attrs.get("href"):
                      self.canonical.append(attrs["href"])
                  if "alternate" in rel and attrs.get("hreflang") and attrs.get("href"):
                      self.alternates.append((attrs["hreflang"], attrs["href"]))

          errors = []
          sitemap_path = ROOT / "sitemap.xml"
          try:
              sitemap = ET.parse(sitemap_path).getroot()
          except (ET.ParseError, OSError) as exc:
              print(f"sitemap.xml: cannot parse XML: {exc}")
              sys.exit(1)

          sitemap_urls = set()
          for url_node in sitemap.findall(f"{SITEMAP_NS}url"):
              loc_node = url_node.find(f"{SITEMAP_NS}loc")
              if loc_node is None or not (loc_node.text or "").strip():
                  errors.append("sitemap.xml: each url entry must have a non-empty loc")
                  continue
              loc = loc_node.text.strip()
              sitemap_urls.add(loc)
              try:
                  target = route_to_file(loc)
                  if not target.is_file():
                      errors.append(f"sitemap.xml: URL does not resolve to a file: {loc}")
              except ValueError as exc:
                  errors.append(f"sitemap.xml: {exc}")

              for alternate in url_node.findall(f"{XHTML_NS}link"):
                  if alternate.attrib.get("rel") != "alternate":
                      continue
                  href = alternate.attrib.get("href", "")
                  lang = alternate.attrib.get("hreflang", "")
                  if not lang or not href:
                      errors.append(f"sitemap.xml: alternate link needs hreflang and href under {loc}")
                      continue
                  if href not in sitemap_urls and href not in {
                      node.find(f"{SITEMAP_NS}loc").text.strip()
                      for node in sitemap.findall(f"{SITEMAP_NS}url")
                      if node.find(f"{SITEMAP_NS}loc") is not None and node.find(f"{SITEMAP_NS}loc").text
                  }:
                      errors.append(f"sitemap.xml: alternate {lang} is not a listed URL: {href}")
                  try:
                      if not route_to_file(href).is_file():
                          errors.append(f"sitemap.xml: alternate target is missing: {href}")
                  except ValueError as exc:
                      errors.append(f"sitemap.xml: {exc}")

          html_files = sorted(path for path in ROOT.rglob("*.html") if ".git" not in path.parts)
          for file in html_files:
              # A 404 page is intentionally non-canonical; it must not enter the sitemap.
              if file.name == "404.html":
                  continue
              parser = Metadata()
              try:
                  parser.feed(file.read_text(encoding="utf-8"))
              except (OSError, UnicodeDecodeError) as exc:
                  errors.append(f"{file}: cannot read HTML: {exc}")
                  continue
              if len(parser.canonical) != 1:
                  errors.append(f"{file}: expected exactly one canonical URL, found {len(parser.canonical)}")
              else:
                  try:
                      if not route_to_file(parser.canonical[0]).is_file():
                          errors.append(f"{file}: canonical URL target does not exist: {parser.canonical[0]}")
                      if parser.canonical[0] not in sitemap_urls:
                          errors.append(f"{file}: canonical URL is missing from sitemap.xml: {parser.canonical[0]}")
                  except ValueError as exc:
                      errors.append(f"{file}: {exc}")
              for lang, href in parser.alternates:
                  if lang not in {"en", "fr", "ar", "x-default"}:
                      errors.append(f"{file}: unsupported hreflang {lang!r}")
                  try:
                      if not route_to_file(href).is_file():
                          errors.append(f"{file}: hreflang target is missing: {href}")
                      if href not in sitemap_urls:
                          errors.append(f"{file}: hreflang target is not in sitemap.xml: {href}")
                  except ValueError as exc:
                      errors.append(f"{file}: {exc}")

          if errors:
              print("\\n".join(errors))
              sys.exit(1)
          print(f"Validated {len(sitemap_urls)} sitemap URLs and canonical/hreflang metadata for {len(html_files)} HTML pages.")
          PY
      - name: Check JavaScript syntax
        run: node --check assets/main.js

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: .
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
